<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050B09" />
    <title>VapeDrop — recycle a vape, find your nearest bin</title>
    <meta
      name="description"
      content="Find the nearest VapeDrop collection bin, get a walking route, and earn rewards for keeping disposable vapes out of landfill."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link
      rel="preload"
      href="/fonts/geist-sans.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <meta property="og:title" content="VapeDrop — find a vape recycling bin near you" />
    <meta
      property="og:description"
      content="Walking routes to vape collection bins, plus rewards for recycling."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <span class="boot-pin"></span>
        <p>Loading VapeDrop…</p>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
